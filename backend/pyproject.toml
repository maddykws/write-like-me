[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "write-like-me-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "python-dotenv>=1.0.0",
  "supabase>=2.4.0",
  "sentence-transformers>=3.0.0",
  "nltk>=3.8.1",
  "anthropic>=0.28.0",
  "openai>=1.30.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
